{% set name = "saspy" %}
{% set version = "5.108.7" %}
{% set hash_val = "6493c29ed19eb2c5a4034f33d681c368463790eecfc7ce0ccd98d1410a6c3edc" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('_', '-') }}-{{ version }}.tar.gz
  sha256: {{ hash_val }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - ipython >=4
    - pygments
    - pandas

test:
  requires:
    - python {{ python_min }}
  imports:
    - saspy

about:
  home: https://github.com/sassoftware/saspy
  license: Apache-2.0
  license_family: Apache
  license_file: {{ environ["RECIPE_DIR"] }}/LICENSE
  summary: A Python interface module to the SAS System

extra:
  recipe-maintainers:
    - tomweber-sas
    - DMcGee-SAS
    - pecarmon-sas
